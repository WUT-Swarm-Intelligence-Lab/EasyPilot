[project]
name = "drone-control"
version = "0.1.0"
description = "Simple interface for scanning, connecting, and controlling Crazyflie 2.x drones"
requires-python = ">=3.13"
dependencies = [
    "cflib>=0.1.26",
    "numpy",
    "opencv-python>=5.0.0.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_control"]
